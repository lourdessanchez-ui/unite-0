<!doctype html><html lang="es"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duo Français · Unité 0</title><style>:root{font-family:system-ui,sans-serif;color:#142542;background:#eef3fa;font-size:16px}*{box-sizing:border-box}body{margin:0}header{max-width:1180px;margin:auto;padding:28px 30px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px;text-decoration:none;color:#142542;font-size:22px}.brand span{color:#345cdb;margin-left:8px}.badge,.eyebrow{font-size:14px;font-weight:750;letter-spacing:1px}.badge{background:white;padding:10px 16px;border-radius:30px}main{max-width:1180px;margin:auto;padding:20px 30px 30px}.intro{display:grid;grid-template-columns:1.4fr 1fr;gap:55px;align-items:center;margin:15px 0 35px}.eyebrow{color:#345cdb}h1{font-size:clamp(32px,4.5vw,54px);line-height:1.1;letter-spacing:-2px;margin:15px 0}p{line-height:1.6;color:#4b5d77;max-width:560px}.setup{background:#142542;color:white;padding:24px;border-radius:22px}h2{margin:0 0 18px;font-size:22px}label{display:block;font-size:14px;font-weight:600}input,select{width:100%;padding:11px;border:1px solid #cad4e5;border-radius:9px;font:inherit;background:white;color:#142542;margin:6px 0 12px}.row{display:flex;gap:14px}.row>*{flex:1;min-width:0}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.game{background:white;text-align:left;border:1px solid #d4deed;border-radius:18px;padding:24px;color:#142542;cursor:pointer;font:inherit;transition:.15s}.game:hover{transform:translateY(-3px);border-color:#345cdb;box-shadow:0 8px 25px #14254213}.number{display:inline-block;background:#e9efff;color:#345cdb;font-weight:800;padding:8px 12px;border-radius:10px;margin-bottom:20px}.game h2{margin-bottom:8px}.game p{margin:0;font-size:15px}.game:last-child{background:#ffe184}.game .tag{font-size:13px;display:block;margin-top:20px;font-weight:700}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e49700;outline-offset:4px}.quiet{background:white;border:1px solid #cbd5e5;padding:10px 16px;border-radius:9px;color:#142542}.primary{background:#345cdb;color:white;border:0;padding:13px 22px;border-radius:10px;font-weight:700}.reference{margin-top:28px}footer{font-size:13px;color:#58697e;margin-top:30px}.panel{background:white;padding:28px;border:1px solid #d4deed;border-radius:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}.score{display:flex;gap:10px;flex-wrap:wrap}.score span{background:#eef3fa;padding:10px 16px;border-radius:10px}.active{box-shadow:inset 0 0 0 2px #345cdb}.question{text-align:center;padding:28px 12px}.prompt{font-size:clamp(26px,4vw,42px);font-weight:800;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:700px;margin:20px auto}.option,.tile{border:2px solid #d8e1ee;background:#f7f9fd;color:#142542;border-radius:12px;padding:20px;font-size:20px}.option:disabled{opacity:1;cursor:default}.good{background:#ddf6e7!important;border-color:#21945b!important}.bad{background:#ffe5e5!important;border-color:#ce3e3e!important}.feedback{min-height:32px;font-weight:700;margin:15px 0}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{min-height:100px;font-size:18px}.tile.matched{background:#ddf6e7;border-color:#21945b;cursor:default}.entry{max-width:450px;margin:20px auto}.entry input{font-size:23px;text-align:center}.pill{background:#e9efff;color:#345cdb;border-radius:20px;padding:7px 14px;display:inline-block;font-size:14px}#words{margin-top:20px;background:white;border-radius:16px;padding:22px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #dde4ef}details{margin-top:20px;text-align:left;background:#eef3fa;padding:15px;border-radius:10px}summary{cursor:pointer;font-weight:600}.oralbox{background:#eef3fa;border-radius:16px;padding:24px;max-width:700px;margin:auto;text-align:left;font-size:20px;line-height:1.6} [hidden]{display:none!important}@media(max-width:760px){header,main{padding:20px}.intro{grid-template-columns:1fr;gap:20px}.games{grid-template-columns:1fr 1fr}.game{padding:18px}.memory{grid-template-columns:repeat(3,1fr)}.panel{padding:18px}.prompt{font-size:28px}}@media(max-width:450px){.games{grid-template-columns:1fr}.options{grid-template-columns:1fr}.brand{font-size:16px}.badge{font-size:12px;padding:8px}.tile{padding:10px;font-size:16px}.row{flex-direction:column;gap:0}}
</style><body><header><a href="#" class="brand">DUO<span>FRANÇAIS</span></a><div class="badge">2.º ESO · Unité 0</div></header><main><section class="intro"><div><div class="eyebrow">LE CLUB DES MOTS</div><h1>Dos jugadores.<br>Un montón de palabras.</h1><p>Adjetivos y profesiones. Elegid un juego y practicad por turnos en la misma pantalla.</p></div><div class="setup"><h2>Votre duo</h2><label>Alumno 1<input id="n0" maxlength="20" value="Alumno 1"></label><label>Alumno 2<input id="n1" maxlength="20" value="Alumno 2"></label><div class="row"><label>Modo<select id="mode"><option value="duel">Duelo por turnos</option><option value="coop">Cooperativo</option></select></label><label>Vocabulario<select id="cat"><option value="all">Todo</option><option value="a">Adjetivos</option><option value="p">Profesiones</option></select></label></div></div></section><section id="menu" class="games"></section><section id="play" hidden></section><section class="reference"><button id="glossary" class="quiet">Consultar el vocabulario</button><div id="words" hidden></div></section><footer>Basado en «Unité 0 — Français 2». Las puntuaciones corresponden a esta partida.</footer></main><script>const data=[['grand','grande','alto/a','a'],['petit','petite','pequeño/a','a'],['brun','brune','moreno/a','a'],['blond','blonde','rubio/a','a'],['roux','rousse','pelirrojo/a','a'],['bavard','bavarde','hablador/a','a'],['désordonné','désordonnée','desordenado/a','a'],['gourmand','gourmande','goloso/a','a'],['étourdi','étourdie','despistado/a','a'],['rigolo','rigolote','divertido/a','a'],['sociable','sociable','sociable','a'],['sympathique','sympathique','simpático/a','a'],['têtu','têtue','terco/a','a'],['timide','timide','tímido/a','a'],['professeur','professeure','profesor/a','p'],['vétérinaire','vétérinaire','veterinario/a','p'],['boulanger','boulangère','panadero/a','p'],['cuisinier','cuisinière','cocinero/a','p'],['jardinier','jardinière','jardinero/a','p'],['coiffeur','coiffeuse','peluquero/a','p'],['policier','policière','policía','p'],['pharmacien','pharmacienne','farmacéutico/a','p']];
const games=[['quiz','Le bon mot','Elige la traducción correcta entre cuatro opciones.','Comprensión'],['memory','Les paires','Encuentra seis parejas de palabras en francés y español.','Memoria'],['write','À vos claviers','Escribe la palabra en francés. Puedes pedir una pista.','Escritura'],['gender','Il ou elle ?','Transforma las palabras del masculino al femenino.','Masculino y femenino'],['oral','À toi de parler','Describe, adivina y conversa con tu compañero.','Expresión oral']];
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={};
$('menu').innerHTML=games.map((g,i)=>`<button class="game" data-game="${g[0]}"><span class="number">0${i+1}</span><h2>${g[1]}</h2><p>${g[2]}</p><span class="tag">${g[3]}</span></button>`).join('');
$('menu').onclick=e=>{let b=e.target.closest('[data-game]');if(b)start(b.dataset.game)};
$('glossary').onclick=()=>{$('words').hidden=!$('words').hidden;$('glossary').textContent=$('words').hidden?'Consultar el vocabulario':'Ocultar el vocabulario'};
$('words').innerHTML=`<h2>Adjetivos y profesiones</h2><div style="overflow:auto"><table><thead><tr><th>Masculino</th><th>Femenino</th><th>Español</th></tr></thead><tbody>${data.map(d=>`<tr><td lang="fr">${d[0]}</td><td lang="fr">${d[1]}</td><td>${d[2]}</td></tr>`).join('')}</tbody></table></div><p>«Étourdi» se trabaja como «despistado/a», su significado en una descripción personal. El PDF lo traduce como «mareado/a».</p>`;
function start(type){let pool=data.filter(d=>$('cat').value==='all'||d[3]===$('cat').value);state={type,pool,names:[$('n0').value.trim()||'Alumno 1',$('n1').value.trim()||'Alumno 2'],coop:$('mode').value==='coop',scores:[0,0],turn:0,i:0,queue:shuffle(pool).slice(0,10),locked:false,mistakes:[],generation:(state.generation||0)+1};$('menu').hidden=true;$('play').hidden=false;if(type==='memory'){state.cards=shuffle(shuffle(pool).slice(0,6).flatMap((d,i)=>[{pair:i,text:d[0],lang:'fr'},{pair:i,text:d[2],lang:'es'}]));state.open=[];state.found=[];state.attempts=0;memory()}else render()}
function bar(){return `<div class="topbar"><button class="quiet" id="back">Todos los juegos</button><div class="score">${state.coop?`<span>Puntos del dúo: ${state.scores[0]+state.scores[1]}</span>`:state.names.map((n,i)=>`<span class="${i===state.turn?'active':''}">${esc(n)}: ${state.scores[i]}</span>`).join('')}</div></div>`}
function shell(body){$('play').innerHTML=`<div class="panel">${bar()}${body}</div>`;$('back').onclick=()=>{state.generation++;$('play').hidden=true;$('menu').hidden=false};}
function turnText(){return state.coop?`Turno de ${esc(state.names[state.turn])} · Ayudaos entre los dos`:`Turno de ${esc(state.names[state.turn])}`}
function render(){if(state.i>=state.queue.length)return finish();state.locked=false;let d=state.queue[state.i],type=state.type;let content=`<div class="question"><span class="pill">${turnText()}</span><p>Ronda ${state.i+1} de ${state.queue.length}</p><h2>${games.find(g=>g[0]===type)[1]}</h2>`;
if(type==='quiz'){let reverse=state.i%2===1;state.correct=reverse?d[0]:d[2];let choices=shuffle([state.correct,...shuffle(state.pool.filter(x=>x!==d)).slice(0,3).map(x=>reverse?x[0]:x[2])]);content+=`<p>${reverse?'¿Cómo se dice en francés?':'¿Qué significa en español?'}</p><div class="prompt" lang="${reverse?'es':'fr'}">${reverse?d[2]:d[0]}</div><div class="options">${choices.map(c=>`<button class="option" data-answer="${esc(c)}">${c}</button>`).join('')}</div>`;}
if(type==='write'||type==='gender'){state.correct=type==='gender'?d[1]:d[0];content+=`<p>${type==='gender'?'Escribe la forma femenina.':'Escribe la forma masculina en francés.'}</p><div class="prompt">${type==='gender'?d[0]:d[2]}</div><form id="form" class="entry"><input id="answer" aria-label="Tu respuesta en francés" autocomplete="off" spellcheck="false" required><button class="primary">Comprobar</button></form><button id="hint" class="quiet">Pista</button><div id="hinttext"></div>`;}
if(type==='oral'){let tasks=[`Describe a una persona usando <strong>${d[0]}</strong> o <strong>${d[1]}</strong> y otro adjetivo. Tu compañero hace una pregunta con «Est-ce que… ?».`,`Da pistas en francés para que tu compañero adivine <strong>${d[0]}</strong>. Evita decir la palabra y su traducción.`,`Imagina un personaje ${d[3]==='p'?'que trabaja como':'que es'} <strong>${d[0]}</strong>. Preséntalo con «Il est…» o «Elle est…» y añade una descripción.`];content+=`<p>Un alumno habla y el otro escucha. Después, intercambiad los papeles.</p><div class="oralbox" lang="fr">${tasks[state.i%3]}</div><details><summary>Ayuda para empezar</summary><p lang="fr">Il est… / Elle est…<br>Mon ami est… / Mon amie est…<br>Est-ce que ton ami est… ?<br>Comment est-ce qu’elle est ?</p><p>Si necesitas una pista: ${d[0]} / ${d[1]} = ${d[2]}.</p></details><p>Al terminar, valorad la respuesta juntos. La web no evalúa la voz.</p><button class="primary" id="oralyes">Reto conseguido</button> <button class="quiet" id="oralno">Necesitamos practicar</button>`;}
content+='<div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary" hidden>Siguiente turno</button></div>';shell(content);
$('play').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.locked)return;let ok=b.dataset.answer===state.correct;b.classList.add(ok?'good':'bad');$('play').querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(x.dataset.answer===state.correct)x.classList.add('good')});resolve(ok)});
if($('form')){$('form').onsubmit=e=>{e.preventDefault();if(state.locked)return;let normalize=s=>s.trim().toLocaleLowerCase('fr').replace(/\s+/g,' ');let got=normalize($('answer').value),correct=normalize(state.correct),ok=got===correct;resolve(ok, !ok&&got.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===correct.normalize('NFD').replace(/[\u0300-\u036f]/g,'')?'Casi: revisa las tildes. ': '');$('answer').disabled=true;$('form').querySelector('button').disabled=true};$('hint').onclick=()=>{$('hinttext').textContent=`Empieza por «${state.correct[0]}» y tiene ${state.correct.length} letras.`};$('answer').focus()}
if($('oralyes')){$('oralyes').onclick=()=>resolve(true);$('oralno').onclick=()=>resolve(false)}$('next').onclick=()=>{state.i++;state.turn=1-state.turn;render()};}
function resolve(ok,prefix=''){if(state.locked)return;state.locked=true;if(ok)state.scores[state.turn]++;else state.mistakes.push(state.queue[state.i]);$('feedback').textContent=state.type==='oral'?(ok?'Bien trabajado. Ahora cambiad los papeles.':'Podéis repetirlo antes de pasar al siguiente turno.'):(ok?'Très bien ! Respuesta correcta.':prefix+`Respuesta: ${state.correct}`);$('feedback').style.color=ok?'#187344':'#aa2929';$('next').hidden=false;}
function memory(){shell(`<span class="pill">${turnText()}</span><h2 style="margin-top:20px">Les paires</h2><p>Une la palabra francesa con su traducción. Cada alumno levanta dos tarjetas. Cambiad de turno tras cada intento. Parejas: ${state.found.length}/6.</p><div class="memory">${state.cards.map((c,i)=>`<button class="tile ${state.found.includes(c.pair)?'matched':''}" data-card="${i}" ${state.found.includes(c.pair)?'disabled':''} aria-label="${state.found.includes(c.pair)||state.open.includes(i)?esc(c.text):'Tarjeta '+(i+1)}">${state.found.includes(c.pair)||state.open.includes(i)?c.text:'?'}</button>`).join('')}</div><p id="memfeedback" aria-live="polite">${state.message||'Encuentra una pareja francés + español.'}</p>`);$('play').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.card);if(state.locked||state.open.includes(i))return;state.open.push(i);memory();if(state.open.length===2){state.locked=true;state.attempts++;let [a,b]=state.open,ok=state.cards[a].pair===state.cards[b].pair;let generation=state.generation;$('memfeedback').textContent=ok?'¡Pareja encontrada!':'No forman pareja. Fíjate en las palabras.';setTimeout(()=>{if(state.generation!==generation)return;if(ok){state.found.push(state.cards[a].pair);state.scores[state.turn]++}state.open=[];state.turn=1-state.turn;state.locked=false;state.message=ok?'¡Una pareja más!':'Intenta recordar dónde estaban.';if(state.found.length===6)finish();else memory()},1400)}})}
function finish(){let a=state.scores[0],b=state.scores[1];shell(`<div class="question"><span class="pill">Partida completada</span><h1>Bravo, le duo !</h1><p style="margin:auto">${state.coop?`Habéis conseguido ${a+b} puntos juntos.`:a===b?'¡Empate! Buen trabajo de los dos.':`${esc(state.names[a>b?0:1])} ha conseguido más puntos en esta partida.`}</p>${state.type==='memory'?`<p style="margin:auto">Seis parejas encontradas en ${state.attempts} intentos.</p>`:`<p style="margin:auto">${a+b} de ${state.queue.length} retos conseguidos.</p>`}${state.mistakes.length?`<details><summary>Palabras para repasar (${state.mistakes.length})</summary>${state.mistakes.map(d=>`<p>${d[0]} / ${d[1]} · ${d[2]}</p>`).join('')}</details>`:''}<p><button id="again" class="primary">Otra partida</button></p></div>`);$('again').onclick=()=>start(state.type)}
</script></body></html>
